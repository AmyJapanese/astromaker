<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Wikidata番号ガチャ</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      height: 100vh;
      display: flex;
      background: #f5f6f8;
      color: #222;
    }

    /* 左サイドバー */
    .sidebar {
      width: 320px;
      background: #ffffff;
      border-right: 1px solid #dcdfe4;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .sidebar h1 {
      font-size: 24px;
      margin: 0 0 8px 0;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section label {
      font-weight: bold;
      font-size: 14px;
    }

    .id-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .prefix {
      font-size: 28px;
      font-weight: bold;
    }

    input[type="number"] {
      width: 100%;
      font-size: 26px;
      padding: 8px 10px;
    }

    input[type="range"] {
      width: 100%;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      padding: 12px;
      font-size: 15px;
      border: 1px solid #c8ccd1;
      background: #fff;
      cursor: pointer;
      border-radius: 8px;
    }

    button:hover {
      background: #f0f2f5;
    }

    .primary {
      background: #3366cc;
      color: white;
      border-color: #3366cc;
    }

    .primary:hover {
      background: #2a57ad;
    }

    .status-box {
      padding: 10px 12px;
      border-radius: 8px;
      background: #f8f9fa;
      border: 1px solid #dadde1;
      font-size: 14px;
      min-height: 44px;
    }

    .hint {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    /* 右側メイン */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid #dcdfe4;
      padding: 14px 20px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .current-link {
      word-break: break-all;
      color: #3366cc;
      text-decoration: none;
    }

    .viewer {
      flex: 1;
      padding: 12px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 1px solid #cfd3d8;
      border-radius: 10px;
      background: white;
    }

    .small-row {
      display: flex;
      gap: 10px;
    }

    .small-row button {
      flex: 1;
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h1>Wikidata番号ガチャ</h1>

    <div class="section">
      <label for="num">ID番号</label>
      <div class="id-row">
        <span class="prefix">Q</span>
        <input type="number" id="num" value="1" min="1" step="1">
      </div>
    </div>

    <div class="section">
      <label for="slider">スライダー</label>
      <input type="range" id="slider" min="1" max="3000000" value="1">
    </div>

    <div class="section">
      <div class="button-grid">
        <button id="minus1">-1</button>
        <button id="plus1">+1</button>
        <button id="minus10">-10</button>
        <button id="plus10">+10</button>
      </div>
    </div>

    <div class="section">
      <div class="small-row">
        <button class="primary" id="showBtn">表示</button>
        <button id="openBtn">ページへ飛ぶ</button>
      </div>
    </div>

    <div class="section">
      <div class="small-row">
        <button id="randomBtn">ランダム</button>
        <button id="copyBtn">URLコピー</button>
      </div>
    </div>

    <div class="section">
      <label>状態</label>
      <div class="status-box" id="status">まだ読み込んでいません</div>
    </div>

    <div class="section">
      <label>操作メモ</label>
      <div class="hint">
        ・数字入力ボックスは ↑↓ キーで増減できます<br>
        ・Enter で表示できます<br>
        ・「ページへ飛ぶ」でWikidata本体を新しいタブで開けます<br>
        ・右側は大きめ表示エリアです
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        現在のURL:
        <a id="currentLink" class="current-link" href="https://www.wikidata.org/wiki/Q1" target="_blank">
          https://www.wikidata.org/wiki/Q1
        </a>
      </div>
    </div>

    <div class="viewer">
      <iframe id="frame" src="https://www.wikidata.org/wiki/Q1"></iframe>
    </div>
  </main>

  <script>
    const num = document.getElementById("num");
    const slider = document.getElementById("slider");
    const frame = document.getElementById("frame");
    const currentLink = document.getElementById("currentLink");
    const status = document.getElementById("status");

    function getUrl() {
      const id = Math.max(1, Number(num.value) || 1);
      return `https://www.wikidata.org/wiki/Q${id}`;
    }

    function syncFromNumber() {
      const value = Math.max(1, Number(num.value) || 1);
      num.value = value;
      slider.value = value;
    }

    function syncFromSlider() {
      num.value = slider.value;
    }

    function updateLinkOnly() {
      const url = getUrl();
      currentLink.href = url;
      currentLink.textContent = url;
    }

    function loadPage() {
      syncFromNumber();
      const url = getUrl();
      frame.src = url;
      currentLink.href = url;
      currentLink.textContent = url;
      status.textContent = `Q${num.value} を表示中`;
    }

    function openInNewTab() {
      syncFromNumber();
      const url = getUrl();
      window.open(url, "_blank");
    }

    function changeValue(amount) {
      const current = Math.max(1, Number(num.value) || 1);
      num.value = Math.max(1, current + amount);
      syncFromNumber();
      updateLinkOnly();
    }

    function randomJump() {
      const r = Math.floor(Math.random() * 3000000) + 1;
      num.value = r;
      syncFromNumber();
      loadPage();
    }

    async function copyUrl() {
      const url = getUrl();
      try {
        await navigator.clipboard.writeText(url);
        status.textContent = `URLをコピーしました: ${url}`;
      } catch (e) {
        status.textContent = "コピーに失敗しました";
      }
    }

    num.addEventListener("input", () => {
      syncFromNumber();
      updateLinkOnly();
    });

    slider.addEventListener("input", () => {
      syncFromSlider();
      updateLinkOnly();
    });

    num.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        loadPage();
      }
    });

    document.getElementById("showBtn").addEventListener("click", loadPage);
    document.getElementById("openBtn").addEventListener("click", openInNewTab);
    document.getElementById("randomBtn").addEventListener("click", randomJump);
    document.getElementById("copyBtn").addEventListener("click", copyUrl);

    document.getElementById("minus1").addEventListener("click", () => changeValue(-1));
    document.getElementById("plus1").addEventListener("click", () => changeValue(1));
    document.getElementById("minus10").addEventListener("click", () => changeValue(-10));
    document.getElementById("plus10").addEventListener("click", () => changeValue(10));

    updateLinkOnly();
  </script>
</body>
</html>
